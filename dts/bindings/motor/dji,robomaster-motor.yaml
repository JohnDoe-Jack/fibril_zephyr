description: DJI RoboMaster C610/C620 motor node

compatible: "dji,robomaster-motor"

include: base.yaml

on-bus: dji,robomaster

properties:
  reg:
    required: true
    description: Motor ID on the RoboMaster bus, in the range 1..8.
  model:
    type: string
    required: true
    enum:
      - c610
      - c620
    description: Motor controller model.
  max-current:
    type: int
    description: >
      Maximum absolute raw command. For C610, 1000 raw counts represent 1 A.
  rotor-speed-bound-rpm:
    type: int
    default: 10000
    description: >
      Maximum absolute rotor speed used to validate continuous position. The
      maximum feedback gap is floor(30000 / rpm) - 1 milliseconds.
  gear-ratio:
    type: int
    description: Optional motor gear ratio metadata for higher-level control.
