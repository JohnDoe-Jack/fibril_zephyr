CONFIG_PWM=y
CONFIG_SERVO=y
CONFIG_CAN=y
CONFIG_SERIAL=y
CONFIG_COBS=y
CONFIG_ESP_NOW_GAMEPAD_BRIDGE=y
CONFIG_ESP_NOW_GAMEPAD_BRIDGE_TIMEOUT_MS=100

CONFIG_LOG=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="RP2350 Gamepad Servo Monitor"
CONFIG_UART_LINE_CTRL=y
# CDC ACM is the log transport, so logging from the transport itself must stay off.
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y
